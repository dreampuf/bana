application: hxbana 
version: 1
runtime: python39
api_version: 1


builtins:
- datastore_admin: on
- deferred: on
- remote_api: on
- appstats: on
 
inbound_services:
- warmup
- mail


handlers:
- url: /js
  static_dir: static/js

- url: /template/.*
  script: auto

- url: /test.*
#  login: admin
  script: auto

- url: /_ah/admin/.*
  script: auto
  login: admin

- url: /_ah/queue/deferred
  script: auto
  login: admin

- url: /mapreduce(/.*)?
  script: auto
  login: admin

- url: /_ah/info/.*
  script: auto
  login: admin

- url: /admin/.*
  script: auto

- url: .*
  script: auto

entrypoint: gunicorn -b :$PORT main:app
